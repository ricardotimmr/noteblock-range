plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven {
        name = "Fabric"
        url = "https://maven.fabricmc.net/"
    }
    maven {
        name = "Terraformers"
        url = "https://maven.terraformersmc.com/"
    }
    mavenCentral()
    maven { url = "https://api.modrinth.com/maven" }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"

    // Development runtime only; these mods are not bundled in VoxyFog.
    if (providers.gradleProperty("withVoxy").isPresent()) {
        runtimeOnly "maven.modrinth:voxy:${project.voxy_version}"
        runtimeOnly "maven.modrinth:sodium:${project.sodium_version}"
        runtimeOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = "UTF-8"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraftVersion", project.minecraft_version
    inputs.property "loaderVersion", project.loader_version

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraftVersion": project.minecraft_version,
                "loaderVersion": project.loader_version
    }
}
